# api.slack.com/apps -> Create New App -> From a manifest -> paste this.
# Then: Basic Information -> App-Level Tokens -> generate one with
# connections:write (that is SLACK_APP_TOKEN, xapp-...). Install to workspace
# -> OAuth & Permissions -> Bot User OAuth Token (SLACK_BOT_TOKEN, xoxb-...).
# Finally /invite the bot into its channel.
display_information:
  name: agent-bot
  description: Engineering and ops bot powered by Claude Code
features:
  bot_user:
    display_name: agent-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history     # public channel messages + threads
      - groups:history       # private channel messages + threads
      - chat:write
      - files:read           # download attachments people post
      - files:write          # attach csvs/reports to threads
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
